{% extends "mainsite/base.html" %}

{% block title %}{{ post.title }} | My Blog{% endblock %}

{% block content %}
    <article class="post-detail">
        <h1>{{ post.title }}</h1>
        <p class="meta">
            <span>Slug:</span> {{ post.slug }} |
            <span>Pub date:</span> {{ post.pub_date|date:"Y-m-d H:i" }}
        </p>
        <p class="body">{{ post.body }}</p>
        <a class="read-more" href="{% url 'index' %}">Back to all posts</a>
    </article>
{% endblock %}
